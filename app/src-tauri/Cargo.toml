[package]
name = "tokenblaze-app"
version = "0.1.0"
description = "TokenBlaze desktop application"
authors = ["TokenBlaze"]
edition = "2021"

[[bin]]
name = "tokenblaze"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokenblaze-core = { path = "../../crates/tokenblaze-core" }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-store = "2"
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
